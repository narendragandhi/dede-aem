version: '3.8'

services:
  dede-java:
    build: .
    image: dede-java:latest
    container_name: dede-java
    ports:
      - "8080:8080"
    volumes:
      - ./scan:/app/scan:ro
      - dede-logs:/var/log/dede
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  dede-logs:
