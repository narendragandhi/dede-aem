<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dede-Java - Architectural Intelligence</title>
    <!-- Cytoscape.js Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <!-- Layout Algorithms -->
    <script src="https://cdn.jsdelivr.net/npm/cytoscape-cose-bilkent@4.1.0/cytoscape-cose-bilkent.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            overflow: hidden;
        }
        #app { display: flex; height: 100vh; }

        /* Sidebar */
        #sidebar {
            width: 320px;
            background: #161b22;
            border-right: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 10;
        }
        #sidebar header {
            padding: 16px;
            border-bottom: 1px solid #30363d;
            background: linear-gradient(135deg, #238636 0%, #1f6feb 100%);
        }
        #sidebar h1 {
            font-size: 18px;
            font-weight: 600;
            color: white;
        }
        #sidebar .subtitle {
            font-size: 11px;
            color: rgba(255,255,255,0.8);
            margin-top: 4px;
        }

        /* Stats */
        #stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 16px;
            border-bottom: 1px solid #30363d;
        }
        .stat-card {
            background: #21262d;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #58a6ff;
        }
        .stat-label {
            font-size: 11px;
            color: #8b949e;
            text-transform: uppercase;
        }

        /* Search */
        #search-box {
            padding: 12px 16px;
            border-bottom: 1px solid #30363d;
        }
        #search-input {
            width: 100%;
            padding: 10px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
        }

        /* Filters */
        #filters {
            padding: 12px 16px;
            border-bottom: 1px solid #30363d;
        }
        .filter-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .chip {
            padding: 4px 10px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
        }
        .chip.active {
            background: #388bfd;
            color: white;
        }

        /* Graph container */
        #graph-container {
            flex: 1;
            position: relative;
            background: #0d1117;
        }
        #cy {
            width: 100%;
            height: 100%;
        }

        /* Details Panel */
        #details-panel {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 340px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            display: none;
            max-height: calc(100vh - 32px);
            overflow-y: auto;
            z-index: 100;
        }
        #details-panel.visible { display: block; }

        /* Controls */
        #controls {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(22, 27, 34, 0.9);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #30363d;
            backdrop-filter: blur(8px);
        }
        .btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn:hover { background: #30363d; border-color: #58a6ff; }
        .btn.primary { background: #238636; border: none; color: white; }

        /* Mode indicators */
        #mode-badge {
            position: absolute;
            top: 16px;
            left: 336px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            background: #21262d;
            border: 1px solid #30363d;
            display: none;
        }
        #mode-badge.blast-radius { display: block; background: #f85149; color: white; border: none; }

        /* Loading */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #30363d; border-top-color: #58a6ff;
            border-radius: 50%; animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="app">
        <div id="sidebar">
            <header>
                <h1>Dede-Java</h1>
                <div class="subtitle">Architectural Intelligence Engine</div>
            </header>
            <div id="stats">
                <div class="stat-card"><div class="stat-value" id="node-count">-</div><div class="stat-label">Nodes</div></div>
                <div class="stat-card"><div class="stat-value" id="edge-count">-</div><div class="stat-label">Edges</div></div>
            </div>
            <div id="search-box">
                <input type="text" id="search-input" placeholder="Search architecture...">
            </div>
            <div id="filters">
                <div class="filter-chips" id="type-filters"></div>
            </div>
            <div id="node-list" style="flex:1; overflow-y:auto; padding:8px;"></div>
        </div>

        <div id="graph-container">
            <div id="cy"></div>
            <div id="mode-badge">Blast Radius Mode</div>
            <div id="loading"><div class="spinner"></div><div>Building Topological Map...</div></div>

            <div id="details-panel">
                <div id="details-header" style="padding:16px; border-bottom:1px solid #30363d;">
                    <h2 id="details-title" style="font-size:16px;">Node Details</h2>
                </div>
                <div id="details-content" style="padding:16px;"></div>
            </div>

            <div id="controls">
                <button class="btn primary" id="btn-layout">Auto-Layout</button>
                <button class="btn" id="btn-blast">Blast Radius Explorer</button>
                <button class="btn" id="btn-reset">Reset View</button>
                <button class="btn" id="btn-refresh">Pull Delta</button>
            </div>
        </div>
    </div>

    <script>
        const nodeStyles = [
            { selector: 'node', style: { 
                'label': 'data(name)', 'color': '#c9d1d9', 'font-size': '10px',
                'background-color': '#8b949e', 'width': 20, 'height': 20,
                'text-valign': 'bottom', 'text-margin-y': 4, 'text-wrap': 'ellipsis', 'text-max-width': 80
            }},
            { selector: 'node[type="BUNDLE"]', style: { 'background-color': '#238636', 'width': 40, 'height': 40, 'font-size': '12px', 'font-weight': 'bold' }},
            { selector: 'node[type="SLING_SERVLET"]', style: { 'background-color': '#ff7b72', 'shape': 'rectangle' }},
            { selector: 'node[type="SLING_MODEL"]', style: { 'background-color': '#f0883e', 'shape': 'diamond' }},
            { selector: 'node[type="OSGI_SERVICE"]', style: { 'background-color': '#db6d28', 'shape': 'triangle' }},
            { selector: 'node[type="JCR_RESOURCE_TYPE"]', style: { 'background-color': '#79c0ff' }},
            { selector: 'node[type="VULNERABILITY"]', style: { 'background-color': '#f85149', 'width': 30, 'height': 30, 'label': '⚠ data(name)' }},
            { selector: 'edge', style: {
                'width': 1, 'line-color': '#30363d', 'target-arrow-color': '#30363d',
                'target-arrow-shape': 'triangle', 'curve-style': 'bezier', 'opacity': 0.6
            }},
            { selector: 'edge[type="EXPOSES"]', style: { 'line-color': '#f85149', 'width': 2, 'line-style': 'dashed' }},
            { selector: 'edge[type="CONSUMES"]', style: { 'line-color': '#d29922' }},
            { selector: '.highlighted', style: { 'background-color': '#58a6ff', 'line-color': '#58a6ff', 'target-arrow-color': '#58a6ff', 'width': 4, 'opacity': 1, 'z-index': 999 }},
            { selector: '.blast-target', style: { 'background-color': '#f85149', 'line-color': '#f85149', 'width': 3, 'opacity': 1 }}
        ];

        let cy;
        let isBlastMode = false;

        async function init() {
            const response = await fetch('/api/graph');
            const data = await response.json();
            
            const elements = {
                nodes: data.nodes.map(n => ({ data: { id: n.id, name: n.name, type: n.type, ...n.properties } })),
                edges: data.edges.map(e => ({ data: { source: e.source, target: e.target, type: e.type } }))
            };

            cy = cytoscape({
                container: document.getElementById('cy'),
                elements: elements,
                style: nodeStyles,
                layout: { name: 'cose-bilkent', animate: false }
            });

            document.getElementById('node-count').textContent = data.nodes.length;
            document.getElementById('edge-count').textContent = data.edges.length;
            document.getElementById('loading').style.display = 'none';

            setupInteractions();
            buildFilters(data.nodes);
        }

        function setupInteractions() {
            cy.on('tap', 'node', (evt) => {
                const node = evt.target;
                if (isBlastMode) {
                    runBlastRadius(node);
                } else {
                    showDetails(node);
                }
            });

            document.getElementById('btn-layout').onclick = () => cy.layout({ name: 'cose-bilkent', animate: true }).run();
            document.getElementById('btn-reset').onclick = () => {
                cy.elements().removeClass('highlighted blast-target');
                cy.fit();
                isBlastMode = false;
                document.getElementById('mode-badge').classList.remove('blast-radius');
            };
            document.getElementById('btn-blast').onclick = () => {
                isBlastMode = !isBlastMode;
                document.getElementById('mode-badge').classList.toggle('blast-radius', isBlastMode);
                if (isBlastMode) alert("Blast Radius Mode: Click any node to see all transitive consumers.");
            };
            document.getElementById('btn-refresh').onclick = async () => {
                const res = await fetch('/api/graph/delta');
                const data = await res.json();
                // Incremental update logic could go here, for now reload full
                cy.json({ elements: { 
                    nodes: data.nodes.map(n => ({ data: { id: n.id, name: n.name, type: n.type } })),
                    edges: data.edges.map(e => ({ data: { source: e.source, target: e.target, type: e.type } }))
                }});
                cy.layout({ name: 'cose-bilkent' }).run();
            };

            // Search
            document.getElementById('search-input').oninput = (e) => {
                const val = e.target.value.toLowerCase();
                if (!val) { cy.elements().style('opacity', 1); return; }
                cy.elements().style('opacity', 0.1);
                cy.nodes().filter(n => n.data('name').toLowerCase().includes(val)).style('opacity', 1).connectedEdges().style('opacity', 1);
            };
        }

        function runBlastRadius(node) {
            cy.elements().removeClass('blast-target');
            // Find all nodes that depend on this node (incoming paths)
            const collection = cy.elements().bfs({
                root: node,
                directed: true,
                directedType: 'inbound' // What calls this?
            }).path;
            
            collection.addClass('blast-target');
            node.addClass('blast-target');
            
            const impactedCount = collection.nodes().length - 1;
            logImpact(node.data('name'), impactedCount);
        }

        function showDetails(node) {
            const panel = document.getElementById('details-panel');
            panel.classList.add('visible');
            document.getElementById('details-title').textContent = node.data('name');
            let html = `<div style="font-size:12px; color:#8b949e; margin-bottom:12px;">Type: ${node.data('type')}</div>`;
            
            // Show properties
            const props = node.data();
            Object.keys(props).forEach(k => {
                if (['id', 'name', 'type'].includes(k)) return;
                html += `<div style="margin-bottom:8px;"><span style="color:#8b949e;">${k}:</span> <span style="font-family:monospace;">${props[k]}</span></div>`;
            });

            document.getElementById('details-content').innerHTML = html;
        }

        function logImpact(name, count) {
            console.log(`Blast Radius for ${name}: ${count} impacted nodes.`);
            const panel = document.getElementById('details-panel');
            panel.classList.add('visible');
            document.getElementById('details-title').textContent = "Impact: " + name;
            document.getElementById('details-content').innerHTML = `
                <div style="text-align:center; padding:20px;">
                    <div style="font-size:48px; color:#f85149; font-weight:bold;">${count}</div>
                    <div style="color:#8b949e; text-transform:uppercase; font-size:12px;">Impacted Nodes</div>
                    <p style="margin-top:20px; font-size:13px;">A change to <b>${name}</b> potentially affects ${count} transitive consumers in the architecture.</p>
                </div>
            `;
        }

        function buildFilters(nodes) {
            const types = [...new Set(nodes.map(n => n.type))];
            const container = document.getElementById('type-filters');
            types.forEach(type => {
                const chip = document.createElement('span');
                chip.className = 'chip active';
                chip.textContent = type;
                chip.onclick = () => {
                    chip.classList.toggle('active');
                    const visibleTypes = Array.from(document.querySelectorAll('.chip.active')).map(c => c.textContent);
                    cy.nodes().forEach(n => {
                        n.style('display', visibleTypes.includes(n.data('type')) ? 'element' : 'none');
                    });
                };
                container.appendChild(chip);
            });
        }

        init();
    </script>
</body>
</html>
